name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run packaging regression tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Validate plugin and Skills
        run: python -X utf8 scripts/validate.py
      - name: Build deterministic plugin archive
        run: python -X utf8 scripts/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: mattpocock-skills-zh-cn
          path: dist/
